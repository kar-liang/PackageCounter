name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Decode app icon
        run: |
          base64 --decode -i icon-1024.b64 -o Assets.xcassets/AppIcon.appiconset/icon-1024.png
          ls -l Assets.xcassets/AppIcon.appiconset/

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned)
        run: |
          xcodebuild \
            -project PackageCounter.xcodeproj \
            -scheme PackageCounter \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/PackageCounter.app"
          test -d "$APP_PATH"
          rm -rf Payload PackageCounter.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry PackageCounter.ipa Payload
          ls -lh PackageCounter.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PackageCounter-ipa
          path: PackageCounter.ipa

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-${{ github.run_number }}
          name: PackageCounter v1.0 (build ${{ github.run_number }})
          files: PackageCounter.ipa
